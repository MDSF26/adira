<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CE1126">
<title>ådirá — Homemade food commerce</title>
<meta name="description" content="Homemade jars, jams, pickles, sauces and pantry favorites. Order online and confirm on WhatsApp.">
<link rel="icon" href="logo-red.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CE1126; --red-dark:#A80E1F; --red-soft:#FCE8EA;
  --bg:#F8F2E9; --card:#FFFFFF; --line:#EEE5D8; --ink:#1E1B18; --muted:#8A817A;
  --shadow:0 2px 10px rgba(60,35,20,.06);
  --r:16px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"Tajawal",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
html[dir=rtl] body{font-family:"Tajawal","Segoe UI",system-ui,sans-serif}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

/* ---------- top app bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--red);color:#fff;padding-top:env(safe-area-inset-top)}
.appbar .wrap{height:64px;display:flex;align-items:center;gap:28px;position:relative}
.brand img{height:34px;width:auto}
.bar-title{font-weight:700;font-size:1.2rem;white-space:nowrap}
.topnav{margin-inline-start:auto;display:flex;align-items:center;gap:22px}
.topnav a{font-weight:600;opacity:.9;position:relative;padding:6px 0}
.topnav a:hover,.topnav a[aria-current=page]{opacity:1}
.topnav a[aria-current=page]::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:2px;background:#fff;border-radius:2px}
.topnav .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;color:var(--red);font-size:.75rem;font-weight:800;margin-inline-start:5px;vertical-align:1px}
.lang{border:1.5px solid rgba(255,255,255,.85);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem;min-height:34px}
.lang:hover{background:#fff;color:var(--red)}

/* ---------- mobile bottom tab bar ---------- */
.tabbar{display:none}
@media (max-width:760px){
  .appbar .wrap{height:58px;justify-content:space-between}
  .topnav a{display:none}
  .brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .brand img{height:30px}
  .bar-title{font-size:.9rem}
  .appbar:not(.sub) .bar-title{display:none}
  .appbar.sub .wrap{height:76px}
  .appbar.sub .brand{top:10px;transform:translateX(-50%)}
  .appbar.sub .bar-title{position:absolute;inset-inline-start:14px;bottom:8px}
  .appbar.sub .lang{position:absolute;inset-inline-end:14px;top:10px}
  .topnav{margin-inline-start:auto}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:grid;justify-items:center;gap:2px;padding:8px 0 9px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
  .tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a[aria-current=page]{color:var(--red)}
  .tabbar .count{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
  body{padding-bottom:70px}
}

/* ---------- shared pieces ---------- */
main.wrap{padding-top:18px;padding-bottom:36px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 16px;height:48px;box-shadow:var(--shadow);cursor:text}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;height:100%;padding:0}
.search:focus-within{border-color:var(--red)}
h2.sec{font-size:1.35rem;font-weight:700;margin:26px 0 12px}
.pill{border:1.5px solid var(--c,var(--red));color:var(--c,var(--red));background:#fff;border-radius:12px;font-weight:600;padding:8px 14px;min-height:42px;white-space:nowrap;text-align:center;display:grid;place-items:center}
.pill:hover{background:color-mix(in srgb,var(--c,var(--red)) 8%,#fff)}
.filter{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font-weight:600;padding:8px 22px;min-height:40px;white-space:nowrap;box-shadow:var(--shadow)}
.filter[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.btn{background:var(--red);color:#fff;border-radius:14px;font-weight:700;min-height:50px;padding:0 22px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.02rem}
.btn:hover{background:var(--red-dark)}
.btn svg{width:22px;height:22px;fill:currentColor}
.plus{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.plus:hover{background:var(--red-dark)}
.plus svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}
.plus[disabled]{background:#D9D1C7;cursor:not-allowed}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--red-soft);border-radius:999px;padding:3px}
.step button{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:1rem;line-height:1;display:grid;place-items:center}
.step span{min-width:24px;text-align:center;font-weight:800;color:var(--red)}
.step.lg button{width:40px;height:40px;font-size:1.25rem}
.step.lg span{min-width:40px;font-size:1.1rem}
.badge{position:absolute;top:8px;inset-inline-start:8px;color:#fff;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--c,var(--red))}
.price{color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .btn{width:auto;display:inline-flex;margin-top:16px}

/* ---------- home ---------- */
.home-top{display:grid;grid-template-columns:1fr 330px;gap:22px;margin-top:18px}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:300px;background:linear-gradient(160deg,#F5E9D8 0%,#EBD7BD 100%)}
.hero.has-photo{background:url(images/hero.jpg) center 60%/cover no-repeat}
.hero .jars{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:0 10px}
.hero .jars svg{height:170px;width:auto}
.hero .jars svg:nth-child(even){height:135px}
.hero.has-photo .jars{display:none}
.hero-label{position:absolute;top:26px;inset-inline-start:26px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);border-radius:14px;padding:12px 22px;max-width:calc(100% - 52px)}
.hero-label strong{display:block;font-size:1.6rem;font-weight:700;line-height:1.15}
.hero-label span{color:var(--muted);font-size:.95rem}
.cats{padding:22px}
.cats h2{font-size:1.3rem;font-weight:700;margin-bottom:16px}
.cats .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.popular{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

/* ---------- product card ---------- */
.pcard{min-width:0;padding:8px 8px 12px;display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(60,35,20,.1)}
.pcard .pic{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#F4ECE1;display:block}
.pic img,.pic svg{width:100%;height:100%;object-fit:cover}
.pic img,.big img,.thumb img{object-fit:contain!important;background:#fff}
.pic:has(img),.big:has(img),.thumb:has(img){background:#fff}
.pcard .info{padding:12px 6px 0;display:flex;flex-direction:column;flex:1;gap:2px}
.pcard h3{font-size:1rem;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.price.tbc{color:var(--muted);font-size:.8rem;font-weight:600;white-space:nowrap}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.sizes a{border:1.5px solid var(--line);border-radius:12px;padding:7px 14px;font-weight:600;font-size:.9rem;background:#fff}
.sizes a[aria-current=true]{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.pcard .unit{color:var(--muted);font-size:.8rem}
.pcard .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.pcard .price{font-size:1.05rem}
.pcard.out .pic{filter:grayscale(.6);opacity:.7}

/* ---------- shop ---------- */
.shopbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;margin-top:14px}
.shopbar strong{font-weight:700}
.shopbar span{color:var(--muted);font-size:.9rem}
.filters{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:16px;margin-top:10px}

/* ---------- product details ---------- */
.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:14px;align-items:start}
.detail .big{border-radius:22px;overflow:hidden;aspect-ratio:1/1;background:#F4ECE1;position:relative}
.detail .big img,.detail .big svg{width:100%;height:100%;object-fit:cover}
.detail .panel{padding:28px}
.detail h1{font-size:2rem;font-weight:700;line-height:1.15}
.detail .sub{color:var(--muted);margin-top:4px}
.detail .price{font-size:1.6rem;margin:14px 0 20px}
.detail h4{font-weight:700;margin-bottom:6px}
.detail p.desc{color:#5E5750;margin-bottom:22px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.back:hover{color:var(--red)}
html[dir=rtl] .back svg{transform:scaleX(-1)}
.soldout-note{background:var(--red-soft);color:var(--red);border-radius:12px;padding:12px 14px;font-weight:600;text-align:center}

/* ---------- cart ---------- */
.cart{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:start}
.cart h1{font-size:1.5rem;font-weight:700;margin:6px 0 14px}
.citem{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 16px 10px 10px;margin-bottom:12px}
html[dir=rtl] .citem{padding:10px 10px 10px 16px}
.citem .thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#F4ECE1;display:block}
.citem .thumb img,.citem .thumb svg{width:100%;height:100%;object-fit:cover}
.citem strong{display:block;font-weight:700}
.citem small{color:var(--muted)}
.citem .right{display:grid;justify-items:end;gap:8px}
.box{padding:18px 20px;margin-bottom:14px}
.box h3{font-weight:700;font-size:1.05rem;margin-bottom:12px}
.sum{display:flex;justify-content:space-between;padding:4px 0;color:#5E5750;gap:10px}
.sum.total{color:var(--ink);font-weight:800;font-size:1.15rem;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.sum.total span:last-child{color:var(--red)}
.fnote{color:var(--muted);font-size:.82rem;margin-top:8px;text-align:center}
form{display:grid;gap:10px}
label{display:grid;gap:5px;font-size:.88rem;font-weight:600}
input,select,textarea{border:1px solid var(--line);background:#FBF8F3;border-radius:12px;padding:11px 13px;width:100%;font-weight:400}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--red);background:#fff}
textarea{min-height:70px;resize:vertical}
.err{color:var(--red);font-size:.8rem;font-weight:600}
.err:empty{display:none}

footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 34px}
footer a{color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600;font-size:.92rem;white-space:nowrap}
.toast.on{opacity:1}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .home-top{grid-template-columns:1fr}
  .popular{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail,.cart{grid-template-columns:1fr}
}
@media (max-width:760px){
  .wrap{padding:0 14px}
  .hero{min-height:210px;border-radius:18px}
  .hero .jars svg{height:120px}.hero .jars svg:nth-child(even){height:96px}
  .hero .jars svg:nth-child(n+6){display:none}
  .hero-label{top:16px;inset-inline-start:16px;padding:9px 16px}
  .hero-label strong{font-size:1.2rem}
  .hero-label span{font-size:.82rem}
  .cats{padding:0;background:none;border:0;box-shadow:none}
  .cats h2{font-size:1.15rem;margin:4px 0 10px}
  .cats .grid2{display:flex;overflow-x:auto;gap:10px;scrollbar-width:none}
  .cats .pill{min-width:104px}
  h2.sec{font-size:1.15rem;margin-top:20px}
  .popular,.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .pcard h3{font-size:.92rem}
  .price.tbc{white-space:normal;font-size:.74rem;line-height:1.2}
  .hero.has-photo{background-position:62% 55%}
  .detail{gap:0}
  .detail .big{border-radius:18px 18px 0 0;aspect-ratio:1/.85}
  .detail .panel{border-radius:22px;margin-top:-26px;position:relative;padding:22px 20px}
  .detail h1{font-size:1.5rem}
  .toast{bottom:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- data ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false; text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c; }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
const yes = v => /^(yes|y|true|1|نعم)$/i.test(v||"");
function toProducts(rows){
  return rows.map((r,i)=>({ id:r.id||String(i+1), category:r.category||"Other", category_ar:r.category_ar,
    name:r.name, name_ar:r.name_ar, description:r.description, description_ar:r.description_ar, details:r.details, details_ar:r.details_ar,
    price:(String(r.price||"").replace(/[^0-9.]/g,"")==="" ? null : parseFloat(String(r.price).replace(/[^0-9.]/g,""))), unit:r.unit, unit_ar:r.unit_ar,
    image:r.image, badge:r.badge, badge_ar:r.badge_ar, popular:yes(r.popular),
    available:!/^(no|n|false|0|sold out)$/i.test(r.available||"yes") })).filter(p=>p.name);
}
async function loadProducts(){
  for(const src of [SHEET_CSV_URL,"products.csv"].filter(Boolean)){
    try{ const res=await fetch(src+(src.includes("?")?"&":"?")+"t="+Date.now()); if(!res.ok) throw 0;
         const list=toProducts(parseCSV(await res.text())); if(list.length) return list; }
    catch(e){ if(src===SHEET_CSV_URL) setTimeout(()=>toast(t("loadFail")),600); }
  }
  return toProducts(parseCSV(FALLBACK_CSV));
}

const catColor = c => (categories().find(x=>x.en===c)||{}).color || "#CE1126";
const catName = c => { const x=categories().find(k=>k.en===c); return x?(lang==="ar"?x.ar:x.en):c; };

function productCard(p){
  const n=cart[p.id]||0, badge=L(p,"badge"), href=`#/p/${encodeURIComponent(p.id)}`;
  const ctrl = !p.available ? `<button class="plus" disabled aria-label="${t("soldOut")}">${I.plus}</button>`
    : n ? `<div class="step"><button data-dec="${esc(p.id)}" aria-label="−">−</button><span>${n}</span><button data-inc="${esc(p.id)}" aria-label="+">+</button></div>`
    : `<button class="plus" data-inc="${esc(p.id)}" aria-label="${t("add")}: ${esc(L(p,"name"))}">${I.plus}</button>`;
  const tag = !p.available ? `<span class="badge" style="--c:#6B625B">${t("soldOut")}</span>` : badge ? `<span class="badge" style="--c:${catColor(p.category)}">${esc(badge)}</span>` : "";
  return `<article class="card pcard${p.available?"":" out"}">

    <div class="info"><a href="${href}"><h3>${esc(L(p,"name"))}</h3></a><span class="unit">${esc(L(p,"unit"))}</span>
    <div class="row">${priceHTML(p)}${ctrl}</div></div></article>`;
}
const searchBox = () => `<label class="search">${I.search}<input type="search" id="q" value="${esc(query)}" placeholder="${t("search")}" aria-label="${t("search")}"></label>`;

/* ---------- views ---------- */
function viewHome(){
  let pop=products.filter(p=>p.popular&&p.available); if(!pop.length) pop=products.filter(p=>p.available);
  const heroJars=["Apricot","Pickle","Sauce","Fig","Zaatar","Makdous","Kishk"].map((s,i)=>jarSVG(s,CAT_COLORS[i%4],false)).join("");
  return `${searchBox()}
  <div class="home-top">
    <div class="hero" id="hero"><div class="jars">${heroJars}</div>
      <div class="hero-label"><strong>${t("heroTitle")}</strong><span>${t("heroSub")}</span></div></div>
    <div class="card cats"><h2>${t("byCat")}</h2><div class="grid2">
      ${categories().map(c=>`<a class="pill" style="--c:${c.color}" href="#/shop/${encodeURIComponent(c.en)}">${esc(lang==="ar"?c.ar:c.en)}</a>`).join("")}
    </div></div>
  </div>
  <h2 class="sec">${t("popular")}</h2>
  <div class="popular">${pop.slice(0,4).map(productCard).join("")}</div>`;
}
function shopList(){
  const q=query.trim().toLowerCase();
  return products.filter(p=>(shopCat==="all"||p.category===shopCat) && (!q || [p.name,p.name_ar,p.description,p.description_ar,p.details,p.category,p.category_ar,p.unit].join(" ").toLowerCase().includes(q)));
}
function viewShop(){
  const list=shopList();
  return `${searchBox()}
  <div class="card shopbar"><strong>${shopCat==="all"?t("allProducts"):esc(catName(shopCat))}</strong><span>${list.length} ${t("items")}</span></div>
  <div class="filters" role="group">
    <button class="filter" data-cat="all" aria-pressed="${shopCat==="all"}">${t("all")}</button>
    ${categories().map(c=>`<button class="filter" data-cat="${esc(c.en)}" aria-pressed="${shopCat===c.en}">${esc(lang==="ar"?c.ar:c.en)}</button>`).join("")}
  </div>
  <div class="pgrid">${list.length?list.map(productCard).join(""):`<p class="empty" style="grid-column:1/-1">${t("noResults")}</p>`}</div>`;
}
function viewDetail(id){
  const p=products.find(x=>x.id===id);
  const sizes = p ? products.filter(x=>x.name===p.name) : [];
  if(!p) return `<div class="card empty"><p>${t("notFound")}</p><a class="btn" href="#/shop">${t("shop")}</a></div>`;
  return `<a class="back" href="#/shop">${I.back}${t("back")}</a>
  <div class="detail">
    <div class="big">${picHTML(p)}</div>
    <div class="card panel">
      <h1>${esc(L(p,"name"))}</h1>
      <div class="sub">${esc(catName(p.category))} · ${esc(L(p,"unit"))}</div>
      <div style="margin:14px 0 20px">${p.price==null?`<span class="price tbc" style="font-size:1.1rem">${t("askPrice")}</span>`:`<span class="price" style="font-size:1.6rem">${money(p.price)}</span>`}</div>
      ${sizes.length>1?`<h4>${t("size")}</h4><div class="sizes">${sizes.map(x=>`<a href="#/p/${encodeURIComponent(x.id)}" aria-current="${x.id===p.id}">${esc(L(x,"unit"))}</a>`).join("")}</div>`:""}
      <h4>${t("description")}</h4><p class="desc">${esc(lang==="ar" ? (p.details_ar||p.description_ar||p.details||p.description) : (p.details||p.description))}</p>
      ${p.available ? `<div class="qtyrow"><h4 style="margin:0">${t("quantity")}</h4>
        <div class="step lg"><button data-dq="-1" aria-label="−">−</button><span id="dq">${detailQty}</span><button data-dq="1" aria-label="+">+</button></div></div>
        <button class="btn" data-addn="${esc(p.id)}">${t("add")}</button>` : `<div class="soldout-note">${t("soldOut")}</div>`}
    </div>
  </div>`;
}
const priceHTML = (p,n=1) => p.price==null ? `<span class="price tbc">${t("askPrice")}</span>` : `<span class="price">${money(p.price*n)}</span>`;
const lineText = (p,n) => p.price==null ? t("mPriceTbc") : money(p.price*n);
const allTbc = () => cartItems().every(x=>x.p.price==null);
const totalText = (msg) => allTbc() ? (msg?t("mTbc"):t("onWa")) : money(subtotal()+(fee()||0)) + (hasTbc() ? (msg?" + "+t("mPriceTbc"):" +") : "");
const hasTbc = () => cartItems().some(x=>x.p.price==null);
const cartItems = () => Object.entries(cart).map(([id,n])=>({p:products.find(x=>x.id===id),n})).filter(x=>x.p);
const subtotal = () => cartItems().reduce((s,{p,n})=>s+(p.price||0)*n,0);
const fee = () => DELIVERY_FEE==null ? null : Number(DELIVERY_FEE);
function viewCart(){
  const list=cartItems();
  if(!list.length) return `<div class="card empty"><p>${t("emptyCart")}</p><a class="btn" href="#/shop">${t("startShopping")}</a></div>`;
  return `<div class="cart">
  <section><h1>${t("yourOrder")}</h1>
    ${list.map(({p,n})=>`<div class="card citem">
      <a class="thumb" href="#/p/${encodeURIComponent(p.id)}">${picHTML(p)}</a>
      <div><strong>${esc(L(p,"name"))}</strong><small>${t("qty")} ${n} · ${esc(L(p,"unit"))}</small></div>
      <div class="right">${priceHTML(p,n)}
        <div class="step"><button data-dec="${esc(p.id)}" aria-label="−">−</button><span>${n}</span><button data-inc="${esc(p.id)}" aria-label="+">+</button></div></div>
    </div>`).join("")}
  </section>
  <section>
    <div class="card box"><h3>${t("details")}</h3>
      <form id="orderForm" novalidate>
        <label>${t("name")}<input name="name" autocomplete="name"><span class="err" data-e="name"></span></label>
        <label>${t("phone")}<input name="phone" type="tel" inputmode="tel" autocomplete="tel"><span class="err" data-e="phone"></span></label>
        <label>${t("address")}<input name="address" autocomplete="street-address"><span class="err" data-e="address"></span></label>
        <label>${t("payment")}<select name="pay"><option value="cod">${t("cod")}</option><option value="whish">${t("whish")}</option><option value="omt">${t("omt")}</option></select></label>
        <label>${t("notes")}<textarea name="notes"></textarea></label>
      </form></div>
    <div class="card box"><h3>${t("summary")}</h3>
      <div class="sum"><span>${t("subtotal")}</span><span>${allTbc()?t("onWa"):money(subtotal())}</span></div>
      <div class="sum"><span>${t("delivery")}</span><span>${fee()==null?t("onWa"):money(fee())}</span></div>
      <div class="sum total"><span>${t("total")}</span><span>${totalText()}</span></div>
      ${hasTbc()?`<p class="fnote" style="text-align:start">${t("someTbc")}</p>`:""}
    </div>
    <button class="btn" id="sendBtn">${I.wa}<span>${t("send")}</span></button>
    <p class="fnote">${t("sendNote")}</p>
  </section></div>`;
}

/* ---------- router ---------- */
function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  const [page,arg]=[parts[0], parts.slice(1).join("/")];
  if(page==="shop"){ shopCat = arg && categories().some(c=>c.en===arg) ? arg : (arg?"all":shopCat); return {name:"shop"}; }
  if(page==="p") return {name:"detail",id:arg};
  if(page==="cart") return {name:"cart"};
  return {name:"home"};
}
function render(keepSearchFocus){
  saveDraft();
  current=route();
  const caret = keepSearchFocus && $("#q") ? $("#q").selectionStart : null;
  $("#view").innerHTML = current.name==="shop"?viewShop(): current.name==="detail"?viewDetail(current.id): current.name==="cart"?viewCart(): viewHome();
  fillDraft();
  $("#barTitle").textContent=t({home:"barHome",shop:"barShop",detail:"barDetail",cart:"barCart"}[current.name]);
  $("#appbar").classList.toggle("sub",current.name!=="home");
  const navKey=current.name==="detail"?"shop":current.name;
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.dataset.nav===navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const hero=$("#hero"); if(hero){ const im=new Image(); im.onload=()=>hero.classList.add("has-photo"); im.src="images/hero.jpg"; }
  if(keepSearchFocus && $("#q")){ const q=$("#q"); q.focus(); const c=caret??q.value.length; q.setSelectionRange(c,c); }
  updateCount();
}
function updateCount(){ const n=Object.values(cart).reduce((a,b)=>a+b,0); document.querySelectorAll("[data-count]").forEach(el=>{ el.textContent=n; el.classList.toggle("hidden",!n); }); }

/* ---------- cart actions ---------- */
function setQty(id,n,msg){
  const p=products.find(x=>x.id===id); if(!p||!p.available) return;
  const before=cart[id]||0; n=Math.max(0,Math.min(99,n));
  if(n) cart[id]=n; else delete cart[id];
  store.set("adira_cart",cart);
  if(msg) toast(msg); else if(!before&&n) toast(t("added"));
  render();
}
function saveDraft(){ const f=$("#orderForm"); if(f){ draft=Object.fromEntries(new FormData(f)); store.set("adira_draft",draft); } }
function fillDraft(){ const f=$("#orderForm"); if(!f) return; for(const [k,v] of Object.entries(draft)) if(f.elements[k]) f.elements[k].value=v; }

function sendOrder(){
  saveDraft(); const d=draft; let ok=true;
  document.querySelectorAll(".err").forEach(e=>e.textContent="");
  const need=(k,m,test)=>{ if(!test((d[k]||"").trim())){ $(`[data-e=${k}]`).textContent=m; ok=false; } };
  need("name",t("needName"),v=>v.length>1);
  need("phone",t("needPhone"),v=>v.replace(/\D/g,"").length>=7);
  need("address",t("needAddress"),v=>v.length>2);
  if(!ok){ document.querySelector(".err:not(:empty)").parentElement.querySelector("input").focus(); return; }
  const pay={cod:t("cod"),whish:t("whish"),omt:t("omt")}[d.pay]||d.pay;
  const msg=[`*${t("msgHead")}*`,"",
    `${t("mName")}: ${d.name.trim()}`,`${t("mPhone")}: ${d.phone.trim()}`,`${t("mAddr")}: ${d.address.trim()}`,`${t("mPay")}: ${pay}`,"",
    `*${t("mItems")}:*`, ...cartItems().map(({p,n})=>`• ${n} × ${L(p,"name")} (${L(p,"unit")}) — ${lineText(p,n)}`),"",
    `${t("mSub")}: ${allTbc()?t("mTbc"):money(subtotal())}`, `${t("mDel")}: ${fee()==null?t("mTbc"):money(fee())}`, `*${t("mTotal")}: ${totalText(true)}*`,
    (d.notes||"").trim()?`\n${t("mNotes")}: ${d.notes.trim()}`:""].join("\n").trim();
  toast(t("opening"));
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
}

let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2000); }

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#langBtn").textContent=t("lang");
  $("#langBtn").setAttribute("aria-label",lang==="ar"?"Switch to English":"التبديل إلى العربية");
  store.set("adira_lang",lang); render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.inc) setQty(b.dataset.inc,(cart[b.dataset.inc]||0)+1);
  else if(b.dataset.dec) setQty(b.dataset.dec,(cart[b.dataset.dec]||0)-1);
  else if(b.dataset.cat){ shopCat=b.dataset.cat; history.replaceState(null,"",shopCat==="all"?"#/shop":"#/shop/"+encodeURIComponent(shopCat)); render(); }
  else if(b.dataset.dq){ detailQty=Math.max(1,Math.min(99,detailQty+Number(b.dataset.dq))); $("#dq").textContent=detailQty; }
  else if(b.dataset.addn){ const id=b.dataset.addn; const n=detailQty; detailQty=1; setQty(id,(cart[id]||0)+n,t("added")); }
  else if(b.id==="sendBtn") sendOrder();
  else if(b.id==="langBtn"){ lang=lang==="en"?"ar":"en"; applyLang(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ query=e.target.value; if(current.name!=="shop"){ shopCat="all"; location.hash="#/shop"; } else render(true); }
  else if(e.target.closest("#orderForm")){ const er=e.target.parentElement.querySelector('.err'); if(er) er.textContent=''; saveDraft(); }
});
window.addEventListener("hashchange",()=>{
  const fromSearch = document.activeElement && document.activeElement.id==="q";
  detailQty=1; render(fromSearch); if(!fromSearch) window.scrollTo(0,0);
});
document.querySelectorAll("[data-wa]").forEach(a=>a.href=`https://wa.me/${WHATSAPP_NUMBER}`);
$("#yr").textContent=new Date().getFullYear();

loadProducts().then(list=>{ products=list; for(const id of Object.keys(cart)) if(!products.some(p=>p.id===id)) delete cart[id]; applyLang(); });
</script>
</body>
</html>
